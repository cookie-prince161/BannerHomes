name: BannerHomes
version: 1.1.0
main: com.elias.bannerhomes.BannerHomes
api-version: '1.20'
description: Visuelles Home-System mit Banner-Auswahl, Main-Home und Einstellungen.

commands:
  homes:
    description: Öffnet das Home-Menü.
    permission: bannerhomes.use
  home:
    description: Teleportiert zum Main-Home oder zu einem bestimmten Home.
    usage: /home [Name|Nummer]
    permission: bannerhomes.use
  homedelete:
    description: Löscht ein bestimmtes Home.
    usage: /homedelete <Name|Nummer>
    permission: bannerhomes.use

permissions:
  bannerhomes.use:
    default: true
