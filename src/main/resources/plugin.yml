name: BannerHomes
version: 1.8.0
main: com.elias.bannerhomes.BannerHomes
api-version: '1.20'
description: Visuelles Home-System mit dynamischer Banner-Verwaltung, Spawn & SD.

commands:
  homes:
    description: Öffnet das Home-Menü oder ändert Admin-Einstellungen.
    usage: /homes [setmax <0-5> | cooldown <homes|spawn|sd> <Sekunden>]
    permission: bannerhomes.use
  homesettings:
    description: Öffnet das Admin-Einstellungsmenü für Dimensionen.
    permission: bannerhomes.admin
  home:
    description: Teleportiert zum Main-Home oder zu einem bestimmten Home.
    usage: /home [Name|Nummer]
    permission: bannerhomes.use
  homedelete:
    description: Löscht ein bestimmtes Home.
    usage: /homedelete <Name|Nummer>
    permission: bannerhomes.use
  tp:
    description: Teleportiert zum Spawn oder Shopping District.
    usage: /tp <spawn|sd|shoppingdistrict>
    permission: bannerhomes.use
  settp:
    description: Setzt den Spawn oder Shopping District Punkt.
    usage: /settp <spawn|sd|shoppingdistrict>
    permission: bannerhomes.admin

permissions:
  bannerhomes.use:
    default: true
  bannerhomes.admin:
    default: op
