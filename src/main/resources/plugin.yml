name: BannerHomes
version: 2.3.0
main: com.elias.bannerhomes.BannerHomes
api-version: 1.20
author: Elias
description: Home & Global Teleport System mit Banner-Guis und Upgrades.

commands:
  home:
    description: Teleportiert dich zu deinem Main-Home oder einem spezifischen Home.
    usage: /home [Name|Nummer]
  homes:
    description: Öffnet das Haupt-GUI für deine Homes.
    usage: /homes
  homeadmin:
    description: Öffnet das Admin-Panel zur Einstellung der Slot-Dimensionen und Max-Homes.
    usage: /homeadmin
    permission: bannerhomes.admin
  homesettings:
    description: Öffnet das Admin-Panel.
    usage: /homesettings
    permission: bannerhomes.admin
  homeupgrades:
    description: Öffnet das Spieler-Upgrade-Menü für Cooldowns und Homes.
    usage: /homeupgrades
  homedelete:
    description: Löscht ein bestimmtes Home.
    usage: /homedelete <Name|Nummer>
  tp:
    description: Teleportiert zu einem globalen Teleport-Punkt.
    usage: /tp <name>
  settp:
    description: Setzt einen globalen Teleport-Punkt mit optionalem Cooldown.
    usage: /settp <name> [cooldownSekunden]
    permission: bannerhomes.admin
  deltp:
    description: Löscht einen globalen Teleport-Punkt.
    aliases: [tpdelete]
    usage: /deltp <name>
    permission: bannerhomes.admin
